</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const CONTACT_ENDPOINT = "https://networkjayjay.com/api/contact";
  const contactForm = document.getElementById("contact-form");
  const contactStatusEl = document.getElementById("contact-status");
  const contactSubmitButton = document.getElementById("contact-submit-button");

  contactForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    contactStatusEl.textContent = "";
    contactStatusEl.className = "form-status";

    const turnstileToken = contactForm.querySelector('[name="cf-turnstile-response"]')?.value;

    const body = {
      name: contactForm.name.value.trim(),
      email: contactForm.email.value.trim(),
      message: contactForm.message.value.trim(),
      website: contactForm.website.value,
      turnstile_token: turnstileToken,
    };

    contactSubmitButton.disabled = true;
    contactStatusEl.textContent = "Sending…";

    try {
      const response = await fetch(CONTACT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const result = await response.json();
      if (!response.ok || !result.ok) {
        throw new Error(result.error || "Something went wrong.");
      }
      contactForm.style.display = "none";
      contactStatusEl.textContent = "Thanks, your message has been sent. I'll get back to you soon.";
      contactStatusEl.className = "form-status success";
    } catch (error) {
      contactStatusEl.textContent = "Couldn't send that: " + error.message;
      contactStatusEl.className = "form-status error";
      contactSubmitButton.disabled = false;
      if (window.turnstile) {
        window.turnstile.reset();
      }
    }
  });
</script>
